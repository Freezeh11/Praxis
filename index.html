<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Praxis — Boolean Simplification</title>
  <meta name="description" content="Learn Boolean laws through play."/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app">

  <!-- ==========================================
       VIEW: HOME (PATH)
       ========================================== -->
  <div id="view-home" class="view show">
    <header class="home-header">
      <div class="logo-area">
        <span class="logo">Praxis</span>
      </div>
      <div class="stats-area">
        <div class="stat-pill text-orange"><span class="stat-icon">🔥</span><span id="home-streak">0</span></div>
        <div class="stat-pill text-red"><span class="stat-icon">❤️</span><span>5</span></div>
      </div>
    </header>
    
    <div class="path-scroll" id="path-container">
      <!-- Path nodes generated by JS -->
    </div>
  </div>


  <!-- ==========================================
       VIEW: LESSON
       ========================================== -->
  <div id="view-lesson" class="view">
    <header class="lesson-header">
      <button id="btn-close-lesson" class="btn-icon">✖</button>
      <div class="progress-container">
        <div class="progress-bar" id="lesson-progress">
          <div class="progress-highlight"></div>
        </div>
      </div>
      <div class="lesson-hearts text-red">❤️ 5</div>
    </header>

    <main class="lesson-main">
      <h1 class="lesson-title" id="lesson-title">Simplify the expression</h1>
      
      <div class="lesson-scenario-box">
        <div class="scenario-avatar">🤖</div>
        <div class="scenario-text" id="lesson-scenario">Scenario goes here.</div>
      </div>
      
      <div class="expr-stage">
        <div id="expr-live">—</div>
      </div>

      <div class="lesson-feedback">
        <span id="moves-badge" class="moves-badge">—</span>
        <div id="stuck-msg" class="stuck-msg"></div>
        <div id="hint-area"></div>
      </div>
    </main>

    <footer class="lesson-footer">
      <button id="btn-undo" class="btn-3d btn-secondary" disabled>↩ Undo</button>
      <button id="btn-reset" class="btn-3d btn-secondary">↺ Restart</button>
      <button id="btn-hint" class="btn-3d btn-hint">💡 Hint</button>
    </footer>
  </div>


  <!-- ==========================================
       FLOATING TOAST
       ========================================== -->
  <div id="law-toast" class="law-toast"></div>


  <!-- ==========================================
       MODAL: LESSON COMPLETE
       ========================================== -->
  <div id="modal-overlay">
    <div class="modal-card">
      <div class="modal-banner">
        <h2 id="m-title">Lesson Complete!</h2>
        <div id="m-stars" class="stars-display">☆☆☆</div>
      </div>
      <div class="modal-body">
        <div class="m-stats-grid">
          <div class="m-stat-box">
            <span class="m-stat-lbl">Your Taps</span>
            <span id="m-taps" class="m-stat-val text-blue">0</span>
          </div>
          <div class="m-stat-box">
            <span class="m-stat-lbl">Reference</span>
            <span id="m-ref" class="m-stat-val text-green">0</span>
          </div>
        </div>

        <div class="m-solution-box">
          <div class="m-sol-title">Optimal Path</div>
          <div id="m-solution"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-modal-continue" class="btn-3d btn-primary w-full">CONTINUE</button>
      </div>
    </div>
  </div>

</div>

<script src="js/parser.js"></script>
<script src="js/moves.js"></script>
<script src="js/problems.js"></script>
<script src="js/app.js"></script>
</body>
</html>
